[package]
name = "nterm-daemon"
version = "0.1.0"
edition = "2024"
publish = false
description = "Owns nterm's shells and a headless terminal for each, so the UI can come and go"

[lib]
name = "nterm_daemon"
path = "src/lib.rs"

[[bin]]
name = "nterm-daemon"
path = "src/main.rs"

[dependencies]
nterm-session = { path = "../nterm-session" }
# What a picker the daemon runs lists and is searched with; see `picker`.
nfm_search_core = { git = "https://github.com/e82eric/npicker", rev = "001ebb5e1807aac26423e1a19f0b6c9f2f09e031" }
nfm_file_system = { git = "https://github.com/e82eric/npicker", rev = "001ebb5e1807aac26423e1a19f0b6c9f2f09e031" }
nfm-picker-sources = { git = "https://github.com/e82eric/npicker", rev = "001ebb5e1807aac26423e1a19f0b6c9f2f09e031" }
crossbeam-channel = "0.5.15"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The terminal library decodes no PNG itself; see `vt::init`.
png = "0.18"
# The file of the pickers of the machine the daemon is on; see `configured`.
csv = "1.3"
mlua = { version = "0.9.9", features = ["lua54", "vendored", "serialize"] }
# The programs a preview of that file runs.
nfm-preview-command = { git = "https://github.com/e82eric/npicker", rev = "001ebb5e1807aac26423e1a19f0b6c9f2f09e031" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
