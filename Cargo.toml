[package]
name = "ghostty-egui"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "ghostty_egui"
path = "src/main.rs"

[[bin]]
name = "npick"
path = "src/npick/main.rs"

[dependencies]
egui = { version = "=0.36.2", default-features = false, features = ["default_fonts"] }
egui-wgpu = { version = "=0.36.2", default-features = false }
egui-winit = { version = "=0.36.2", default-features = false, features = ["clipboard", "wayland", "x11"] }
# Window handles for creating wgpu surfaces.
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
# DX12 on Windows, Vulkan elsewhere; spirv carries custom ShaderToy shaders.
wgpu = { version = "30.0", default-features = false, features = ["std", "dx12", "vulkan", "wgsl", "spirv"] }
pollster = "0.4"
regex = "1.13"
unicode-segmentation = "1.13"
unicode-width = "0.2.2"
crossbeam-channel = "0.5"
serde_json = "1"
getrandom = "0.3"
hmac = "0.12"
sha2 = "0.10"
mlua = { version = "0.9.9", features = ["lua54", "vendored", "serialize"] }
serde = { version = "1", features = ["derive"] }
nfm_search_core = { git = "https://github.com/e82eric/npicker", rev = "a322f84e4fa21340ae8f967025bc91fd808bd677" }
nfm-picker-sources = { git = "https://github.com/e82eric/npicker", rev = "a322f84e4fa21340ae8f967025bc91fd808bd677" }
nfm-egui = { git = "https://github.com/e82eric/npicker", rev = "a322f84e4fa21340ae8f967025bc91fd808bd677" }
nfm-preview-file = { git = "https://github.com/e82eric/npicker", rev = "a322f84e4fa21340ae8f967025bc91fd808bd677" }
nfm-preview-command = { git = "https://github.com/e82eric/npicker", rev = "a322f84e4fa21340ae8f967025bc91fd808bd677" }
nfm_file_system = { git = "https://github.com/e82eric/npicker", rev = "a322f84e4fa21340ae8f967025bc91fd808bd677" }
csv = "1.3"

[build-dependencies]
cc = "1.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }
