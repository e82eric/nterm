[package]
name = "ghostty-egui"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "ghostty_egui"
path = "src/main.rs"

[dependencies]
egui = { version = "=0.36.2", default-features = false, features = ["default_fonts"] }
egui_glow = { version = "=0.36.2", features = ["winit"] }
egui-winit = { version = "=0.36.2", default-features = false, features = ["clipboard", "wayland", "x11"] }
glow = "=0.17.0"
glutin = "=0.32.3"
glutin-winit = "=0.5.0"
regex = "1.13"
unicode-segmentation = "1.13"
unicode-width = "0.2.2"
crossbeam-channel = "0.5"
serde_json = "1"
getrandom = "0.3"
hmac = "0.12"
sha2 = "0.10"
mlua = { version = "0.9.9", features = ["lua54", "vendored", "serialize"] }
serde = { version = "1", features = ["derive"] }
nfm_search_core = { git = "https://github.com/e82eric/npicker", rev = "58300690bbddfba5ae8d8682d5bda81a6fbfc8ee" }
nfm-picker-sources = { git = "https://github.com/e82eric/npicker", rev = "58300690bbddfba5ae8d8682d5bda81a6fbfc8ee" }
nfm-egui = { git = "https://github.com/e82eric/npicker", rev = "58300690bbddfba5ae8d8682d5bda81a6fbfc8ee" }
nfm-preview-file = { git = "https://github.com/e82eric/npicker", rev = "58300690bbddfba5ae8d8682d5bda81a6fbfc8ee" }
csv = "1.3"

[build-dependencies]
cc = "1.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }
nfm_file_system = { git = "https://github.com/e82eric/npicker", rev = "58300690bbddfba5ae8d8682d5bda81a6fbfc8ee" }
