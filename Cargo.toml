[package]
name = "ghostty-egui"
version = "0.1.0"
edition = "2024"
publish = false

[features]
vulkan = ["dep:egui-wgpu", "dep:wgpu", "dep:pollster", "dep:bytemuck"]

[[bin]]
name = "ghostty_egui"
path = "src/main.rs"

[dependencies]
egui-wgpu = { version = "=0.36.2", default-features = false, optional = true }
wgpu = { version = "30.0", default-features = false, features = ["std", "vulkan", "wgsl", "spirv"], optional = true }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
egui = { version = "=0.36.2", default-features = false, features = ["default_fonts"] }
egui_glow = { version = "=0.36.2", features = ["winit"] }
egui-winit = { version = "=0.36.2", default-features = false, features = ["clipboard", "wayland", "x11"] }
glow = "=0.17.0"
glutin = "=0.32.3"
glutin-winit = "=0.5.0"
regex = "1.13"
unicode-segmentation = "1.13"
unicode-width = "0.2.2"
crossbeam-channel = "0.5"
serde_json = "1"
getrandom = "0.3"
mlua = { version = "0.9.9", features = ["lua54", "vendored", "serialize"] }
serde = { version = "1", features = ["derive"] }
nfm_search_core = { path = "G:/src/RustWin32Host/nfm-search-core" }
nfm-picker-sources = { path = "G:/src/RustWin32Host/nfm-picker-sources" }
nfm-egui = { path = "G:/src/RustWin32Host/nfm-egui", features = ["ghostty-vt"] }
csv = "1.3"

[build-dependencies]
cc = "1.2"

[target.'cfg(windows)'.dependencies]
nfm_file_system = { path = "G:/src/RustWin32Host/nfm-file-system" }
